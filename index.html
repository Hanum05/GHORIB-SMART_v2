<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghorib Smart - Platform Edukasi & AI Scanner Al-Qur'an</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #0F5C4D;
            --primary-dark: #08483D;
            --primary-light: #E7F3F1;
            --bg-main: #F8F7F2;
            --surface: #FFFFFF;
            --gold: #C9A227;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #2E8B57;
            --warning: #D89B27;
            --error: #C94C4C;
            --border: #E5E7EB;

            --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; 
            --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

            --rad-sm: 8px; --rad-md: 16px; --rad-lg: 24px; --rad-full: 999px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            
            --font-ui: 'Inter', sans-serif;
            --font-arab: 'Amiri', serif;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-ui); background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; outline: none; }
        a { text-decoration: none; color: inherit; }
        input, select { font-family: inherit; }
        
        #app { display: flex; min-height: 100vh; overflow: hidden; }
        #sidebar { display: none; width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); flex-direction: column; padding: var(--sp-6); z-index: 50; }
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        #bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: var(--sp-2) var(--sp-4); justify-content: space-between; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 16px); }
        
        .view { display: none; animation: fadeIn 0.3s ease; padding: var(--sp-4); max-width: 800px; margin: 0 auto; width: 100%; }
        .view.active { display: block; }
        .fullscreen-view { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: var(--sp-6); text-align: center; background: var(--surface); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: var(--sp-2); }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: var(--sp-2); }
        h3 { font-size: 16px; font-weight: 600; }
        p { color: var(--text-muted); margin-bottom: var(--sp-4); }
        .text-arab { font-family: var(--font-arab); font-size: 32px; line-height: 2; direction: rtl; text-align: right; margin: var(--sp-6) 0; }
        .highlight { background:#FFF0A6; color:#292719; font-weight:700; border-radius:4px; padding:0 .08em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
        .quran-verse { display:block; direction:rtl; unicode-bidi:plaintext; text-align:right; padding:10px 8px; margin:8px 0; border-bottom:1px solid var(--border); overflow-wrap:normal; word-break:normal; }
        .quran-verse:last-child { border-bottom:0; }
        .quran-verse-ref { display:block; direction:ltr; text-align:left; font:600 12px/1.4 var(--font-ui); color:var(--text-muted); margin-bottom:4px; }
        .quran-verse-text { direction:rtl; unicode-bidi:plaintext; font-family:var(--font-arab); font-size:clamp(25px, 4.6vw, 32px); line-height:2.15; text-align:justify; text-align-last:center; }
        .quran-verse-number { display:inline-block; white-space:nowrap; color:var(--primary); font-size:.78em; padding-inline-start:.25em; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); padding: 12px 24px; border-radius: var(--rad-full); font-weight: 600; transition: all 0.2s; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .btn-secondary { background: var(--primary-light); color: var(--primary); }
        .btn-outline { border: 1px solid var(--border); color: var(--text-main); }
        
        .card { background: var(--surface); border-radius: var(--rad-md); padding: var(--sp-4); box-shadow: var(--shadow-sm); margin-bottom: var(--sp-4); border: 1px solid var(--border); }
        .card-primary { background: var(--primary); color: white; }
        .card-primary p, .card-primary .text-muted { color: rgba(255,255,255,0.8); }

        .input-group { margin-bottom: var(--sp-4); text-align: left; width: 100%; }
        .input-group label { display: block; margin-bottom: var(--sp-2); font-weight: 500; font-size: 14px; }
        .input-control { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--rad-sm); font-size: 16px; transition: border 0.2s; }
        .input-control:focus { border-color: var(--primary); outline: none; }
        
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
        .radio-card { border: 1px solid var(--border); border-radius: var(--rad-sm); padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .radio-card.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); color: var(--text-muted); font-size: 12px; padding: var(--sp-2); border-radius: var(--rad-sm); flex: 1; }
        .nav-item i { font-size: 24px; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        
        .sidebar-item { display: flex; align-items: center; gap: var(--sp-3); padding: 12px 16px; color: var(--text-muted); font-weight: 500; border-radius: var(--rad-sm); margin-bottom: var(--sp-2); transition: all 0.2s; }
        .sidebar-item:hover { background: var(--bg-main); }
        .sidebar-item.active { background: var(--primary-light); color: var(--primary); }
        .sidebar-item i { font-size: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-6); padding-top: var(--sp-4); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid var(--primary); }

        .progress-container { width: 100%; background: var(--border); border-radius: var(--rad-full); height: 8px; overflow: hidden; margin-top: var(--sp-2); }
        .progress-bar { height: 100%; background: var(--primary); border-radius: var(--rad-full); transition: width 0.5s ease; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
        .quick-action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); background: var(--surface); padding: var(--sp-4); border-radius: var(--rad-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); color: var(--text-main); font-weight: 500; font-size: 14px; text-align: center; cursor: pointer; }
        .quick-action i { font-size: 28px; color: var(--primary); }

        .tabs { display: flex; gap: var(--sp-2); overflow-x: auto; padding-bottom: var(--sp-2); margin-bottom: var(--sp-4); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: var(--rad-full); background: var(--surface); border: 1px solid var(--border); font-size: 14px; white-space: nowrap; color: var(--text-muted); cursor: pointer; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .material-card { display: flex; align-items: center; gap: var(--sp-4); }
        .material-num { width: 48px; height: 48px; border-radius: var(--rad-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; flex-shrink: 0; }
        .material-info { flex: 1; }
        .material-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: var(--sp-1); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: var(--rad-full); background: var(--bg-main); color: var(--text-muted); }
        .status-badge.selesai { background: #dcfce7; color: var(--success); }
        .status-badge.sedang { background: #fef3c7; color: var(--warning); }

        .audio-player { background: var(--primary-light); border-radius: var(--rad-md); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); margin: var(--sp-4) 0; }
        .audio-controls { display: flex; align-items: center; gap: var(--sp-3); }
        .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
        .track-info { flex: 1; }
        .time-display { font-size: 12px; color: var(--primary-dark); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .custom-slider { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(15, 92, 77, 0.2); border-radius: 4px; outline: none; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; }

        .quiz-option { padding: 16px; border: 2px solid var(--border); border-radius: var(--rad-md); margin-bottom: var(--sp-3); cursor: pointer; transition: all 0.2s; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .quiz-option.selected { border-color: var(--primary); background: var(--primary-light); }
        .quiz-option.correct { border-color: var(--success); background: #dcfce7; }
        .quiz-option.wrong { border-color: var(--error); background: #fee2e2; }
        .quiz-review-card { margin-top: 16px; }
        .quiz-review-header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:10px; }
        .quiz-status { font-size:12px; font-weight:700; padding:4px 9px; border-radius:var(--rad-full); white-space:nowrap; }
        .quiz-status.correct { background:#dcfce7; color:var(--success); }
        .quiz-status.wrong { background:#fee2e2; color:var(--error); }
        .quiz-review-label { font-size:12px; color:var(--text-muted); margin-bottom:3px; }
        .quiz-review-answer { font-size:14px; margin-bottom:10px; }
        .quiz-explanation { background:var(--primary-light); border-radius:var(--rad-sm); padding:12px; margin-top:10px; font-size:13px; line-height:1.55; }
        .quiz-option-explanations { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
        .quiz-option-explanation { font-size:13px; line-height:1.5; margin-bottom:7px; }
        .quiz-option-explanation:last-child { margin-bottom:0; }
        .quiz-review-question { font-size:16px; line-height:1.65; margin-bottom:14px; }

        
        .mascot-container { width: 180px; height: 180px; margin: 0 auto var(--sp-4); background: var(--primary-light); border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 3px solid var(--primary); }
        .mascot-container img { width: 100%; height: 100%; object-fit: cover; }

        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
        .badge-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: 14px; text-align: center; }
        .badge-item.locked { opacity: 0.4; filter: grayscale(100%); }
        .badge-icon { font-size: 32px; margin-bottom: 6px; }
        .badge-title { font-weight: 600; font-size: 13px; }
        .badge-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }


        /* Mobile Profile Menu + Profile Photo Crop */
        .profile-menu-wrap { position: relative; }
        .profile-trigger { cursor: pointer; }
        .profile-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 190px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rad-md);
            box-shadow: var(--shadow-lg);
            padding: 8px;
            z-index: 80;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
        }
        .profile-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .profile-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: var(--rad-sm);
            color: var(--text-main);
            font-size: 14px;
            text-align: left;
        }
        .profile-menu-item:hover, .profile-menu-item:active { background: var(--primary-light); color: var(--primary); }
        .profile-menu-item i { width: 20px; color: var(--primary); font-size: 18px; }
        .profile-photo { object-fit: cover; border-radius: 50%; display: block; }

        #profile-crop-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .68);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 400;
        }
        #profile-crop-modal.active { display: flex; }
        .profile-crop-dialog {
            width: min(100%, 430px);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--surface);
            border-radius: var(--rad-lg);
            padding: var(--sp-6);
            box-shadow: var(--shadow-lg);
        }
        .crop-stage {
            width: min(100%, 360px);
            aspect-ratio: 1 / 1;
            margin: 14px auto;
            position: relative;
            overflow: hidden;
            background: #111827;
            border-radius: var(--rad-md);
            touch-action: none;
            user-select: none;
        }
        .crop-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255,255,255,.9);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
        }
        #profile-crop-image {
            position: absolute;
            left: 50%;
            top: 50%;
            max-width: none;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
            cursor: grab;
        }
        #profile-crop-image.dragging { cursor: grabbing; }
        .crop-controls { display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
        .crop-controls input { flex:1; accent-color: var(--primary); }
        .crop-preview-wrap { text-align:center; margin-top:10px; }
        #profile-crop-preview {
            width:88px;
            height:88px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid var(--primary-light);
            display:none;
            margin:8px auto 0;
        }
        .crop-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }

        /* Scanner UI */
        #scanner-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
        #scanner-view.active { display: flex; }
        .scanner-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; color: white; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
        .scanner-body { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-frame { width: 280px; height: 180px; border: 2px dashed rgba(255,255,255,0.8); border-radius: var(--rad-md); position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; text-align: center; pointer-events: none; }
        
        .detection-highlight { position: absolute; background: rgba(201, 162, 39, 0.45); border: 2px solid var(--gold); border-radius: 6px; padding: 4px 8px; cursor: pointer; animation: pulseHighlight 1.5s infinite; z-index: 5; box-shadow: 0 0 10px rgba(201, 162, 39, 0.8); }
        @keyframes pulseHighlight { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        
        .scanner-footer { padding: 20px; background: rgba(0,0,0,0.85); color: white; text-align: center; position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; }
        .popup-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top-left-radius: var(--rad-lg); border-top-right-radius: var(--rad-lg); padding: var(--sp-6); z-index: 250; box-shadow: 0 -10px 25px rgba(0,0,0,0.25); transform: translateY(100%); transition: transform 0.3s ease; }
        .popup-sheet.active { transform: translateY(0); }

        /* --- HOME MASCOT WELCOME OVERLAY --- */
        #mascot-welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 180;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            background: rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0s linear 0.25s;
        }
        #mascot-welcome-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.25s ease;
        }
        #mascot-welcome-overlay.closing {
            opacity: 0;
            pointer-events: none;
        }
        #mascot-welcome-gif {
            display: block;
            width: 40vw;
            max-width: 100%;
            height: auto;
            max-height: 90vh;
            object-fit: contain;
            object-position: bottom center;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            outline: none;
            flex: 0 1 auto;
        }
        @media (max-width: 767px) {
            #mascot-welcome-gif {
                width: 50vw;
                max-width: 100%;
                max-height: 75vh;
            }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            #mascot-welcome-gif {
                width: 45vw;
                max-width: 100%;
                max-height: 80vh;
            }
        }

        @media (min-width: 1024px) {
            #bottom-nav { display: none; }
            #sidebar { display: flex; }
            #main-content { padding-bottom: 0; }
            .view { padding: var(--sp-8); max-width: 900px; margin: 0; }
            .desktop-2-col { display: grid; grid-template-columns: 2fr 1fr; gap: var(--sp-8); align-items: start; }
            .sticky-panel { position: sticky; top: var(--sp-8); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Sidebar Desktop -->
    <nav id="sidebar">
        <div style="margin-bottom: 32px; font-weight: bold; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px;">
            <i class="ph-fill ph-book-open-text"></i> GHORIB SMART
        </div>
        <div class="sidebar-links"></div>
    </nav>

    <main id="main-content"></main>

    <!-- Bottom Nav Mobile -->
    <nav id="bottom-nav"></nav>
</div>

<!-- Home Mascot Welcome Overlay -->
<div id="mascot-welcome-overlay" aria-hidden="true">
    <img id="mascot-welcome-gif" src="" data-src="sambutan maskot.gif" alt="Maskot Ghorib Smart">
</div>

<!-- AI Camera Scanner Overlay -->
<div id="scanner-view">
    <div class="scanner-header">
        <button onclick="closeScanner()" style="color:white; font-size:24px;"><i class="ph-x"></i></button>
        <div style="font-weight:600;">AI Camera Scanner</div>
        <div style="width:24px;"></div>
    </div>
    <div class="scanner-body" id="scanner-viewport">
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="scanner-frame">
            <span style="color:white; font-size:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px;">Arahkan kamera ke halaman mushaf / kitab</span>
        </div>
        <div id="detection-boxes"></div>
    </div>
    <div class="scanner-footer">
        <p id="scanner-status" style="font-size:13px; margin-bottom:12px; color:rgba(255,255,255,0.9);">Siap memindai bacaan Ghorib secara langsung...</p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="simulateScanDetection()" style="padding:10px 18px; font-size:13px; width:auto;">Deteksi Teks Live</button>
            <button class="btn btn-outline" onclick="openManualSearchFallback()" style="color:white; border-color:rgba(255,255,255,0.5); padding:10px 18px; font-size:13px; width:auto;">Cari Manual</button>
        </div>
    </div>
</div>

<!-- Bottom Sheet Popup Card (Scanner Result) -->
<div class="popup-sheet" id="scanner-popup">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span class="status-badge sedang" id="popup-badge">Bacaan Ghorib</span>
        <button onclick="closePopupSheet()" style="font-size:20px; color:var(--text-muted);"><i class="ph-x"></i></button>
    </div>
    <h3 id="popup-title" style="margin-bottom:2px; font-size:20px;">Imalah</h3>
    <p id="popup-surat" style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Surat Hud: 41</p>

      {id:1,title:"Ta'dilu — I'dilu",surat:"Surah Al-Ma'idah",ayat:"8",juz:"6",desc:"Jika dibaca waqaf, lafaz tetap dibaca أَلَّا تَعْدِلُوا ۚ اعْدِلُوا. Jika dibaca washal, bacaan diteruskan tanpa berhenti di antara kedua lafaz menjadi أَلَّا تَعْدِلُوا اعْدِلُوا.",audio:"01.ta'dilu i'dilu.mp3",keywords:["ta'dilu","idilu","waqaf","washal","al-ma'idah"],verses:[{ref:"QS. Al-Ma'idah 5:8",number:"٨",text:"يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُونُوا۟ قَوَّٰمِينَ لِلَّهِ شُهَدَآءَ بِٱلْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ عَلَىٰٓ أَلَّا تَعْدِلُوا۟ ۚ ٱعْدِلُوا۟ هُوَ أَقْرَبُ لِلتَّقْوَىٰ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ",focus:["أَلَّا تَعْدِلُوا۟ ۚ ٱعْدِلُوا۟"]}]},
      {id:2,title:"Tulisan SHAAD dengan SIIN kecil",surat:"Surah Al-Baqarah; Al-A'raf; At-Thur; Al-Ghasyiyah",ayat:"245; 69; 37; 22",juz:"2; 8; 27; 30",desc:"Empat contoh tulisan SHAAD dengan SIIN kecil dan tiga pola pembacaan: (1) wajib dibaca SIIN pada يَبْصُطُ dan بَصْطَةً; (2) boleh dibaca SHAAD atau SIIN pada ٱلْمُصَيْطِرُونَ; (3) tetap dibaca SHAAD pada بِمُصَيْطِرٍ.",audio:"02.tahmil 'alaihi yal-hats.mp3",keywords:["shaad","sin kecil","yabsuthu","basthatan","musaytirun","musaytir","baqarah","araf","thur","ghasyiyah"],verses:[{ref:"QS. Al-Baqarah 2:245",number:"٢٤٥",text:"مَّن ذَا ٱلَّذِي يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًا كَثِيرَةً ۚ وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ تُرْجَعُونَ",focus:["يَبْصُۜطُ"]},{ref:"QS. Al-A'raf 7:69",number:"٦٩",text:"أَوَعَجِبْتُمْ أَن جَآءَكُم ذِكْرٌ مِّن رَّبِّكُمْ عَلَىٰ رَجُلٍ مِّنكُمْ لِيُنذِرَكُمْ ۚ وَٱذْكُرُوٓا۟ إِذْ جَعَلَكُمْ خُلَفَآءَ مِنۢ بَعْدِ قَوْمِ نُوحٍ وَزَادَكُمْ فِي ٱلْخَلْقِ بَصۜۡطَةٗ ۖ فَٱذْكُرُوٓا۟ ءَالَآءَ ٱللَّهِ لَعَلَّكُمْ تُفْلِحُونَ",focus:["بَصۜۡطَةٗ"]},{ref:"QS. At-Tur 52:37",number:"٣٧",text:"أَمْ عِندَهُمْ خَزَآئِنُ رَبِّكَ أَمْ هُمُ ٱلْمُصَۜيْطِرُونَ",focus:["ٱلْمُصَۜيْطِرُونَ"]},{ref:"QS. Al-Ghasyiyah 88:22",number:"٢٢",text:"لَّسْتَ عَلَيْهِم بِمُصَۜيْطِرٍ",focus:["بِمُصَۜيْطِرٍ"]}]},
      {id:3,title:"Ya'l-hats — Dzalika",surat:"Surah Al-A'raf",ayat:"176",juz:"9",desc:"Pada lafaz يَلْهَثْ ذَٰلِكَ dibahas Idgham Mutajanisain, termasuk perbedaan bacaan ketika waqaf dan washal. Teks ayat ditampilkan utuh.",audio:"02.tahmil 'alaihi yal-hats.mp3",keywords:["yalhats","yal-hats","dzalika","idgham mutajanisain","waqaf","washal","al-araf"],verses:[{ref:"QS. Al-A'raf 7:176",number:"١٧٦",text:"وَلَوْ شِئْنَا لَرَفَعْنَٰهُ بِهَا وَلَٰكِنَّهُۥٓ أَخْلَدَ إِلَى ٱلْأَرْضِ وَٱتَّبَعَ هَوَىٰهُ ۚ فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَث ۚ ذَٰلِكَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا ۚ فَٱقْصُصِ ٱلْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَ",focus:["يَلْهَث ۚ ذَٰلِكَ"]}]},
      {id:4,title:"Imalah",surat:"Surah Hud",ayat:"41",juz:"12",desc:"Imalah berarti memiringkan bunyi fathah ke arah kasrah kira-kira dua pertiga. Contohnya terdapat pada lafaz مَجْر۪ىٰهَا dalam Surah Hud ayat 41.",audio:"03.Imalah.mp3",keywords:["imalah","majraha","hud"],verses:[{ref:"QS. Hud 11:41",number:"٤١",text:"۞ وَقَالَ ٱرْكَبُوا۟ فِيهَا بِسْمِ ٱللَّهِ مَجْر۪ىٰهَا وَمُرْسَىٰهَآ ۚ إِنَّ رَبِّي لَغَفُورٌ رَّحِيمٌ",focus:["مَجْر۪ىٰهَا"]}]},
      {id:5,title:"Ya Bunayya — Irkam Ma'ana",surat:"Surah Hud",ayat:"42",juz:"12",desc:"Pada lafaz ارْكَبْ مَعَنَا, huruf BAA' sukun bertemu MIIM. BAA' sukun diidghamkan menjadi MIIM sukun; kaidah ini disebut Idgham Mutajanisain.",audio:"04.Ya bunayya irkam ma'ana.mp3",keywords:["ya bunayya","irkab","irkam","ma'ana","idgham mutajanisain","hud"],verses:[{ref:"QS. Hud 11:42",number:"٤٢",text:"وَهِيَ تَجْرِي بِهِمْ فِي مَوْجٍ كَٱلْجِبَالِ وَنَادَىٰ نُوحٌ ٱبْنَهُۥ وَكَانَ فِي مَعْزِلٍ يَٰبُنَيَّ ٱرْكَبْ مَعَنَا وَلَا تَكُن مَّعَ ٱلْكَافِرِينَ",focus:["يَٰبُنَيَّ ٱرْكَبْ مَعَنَا"]}]},
      {id:6,title:"Isymam",surat:"Surah Yusuf",ayat:"11",juz:"12",desc:"Isymam adalah mencampurkan bunyi fathah dengan dhammah yang disertai gerakan bibir mencucu sebagai isyarat bunyi dhammah ketika dengung.",audio:"05.Isymam.mp3",keywords:["isymam","taamanna","yusuf"],verses:[{ref:"QS. Yusuf 12:11",number:"١١",text:"قَالُوا۟ يَـٰٓأَبَانَا مَا لَكَ لَا تَأْمَ۫نَّا عَلَىٰ يُوسُفَ وَإِنَّا لَهُۥ لَنَٰصِحُونَ",focus:["لَا تَأْمَ۫نَّا"]}]},
      {id:7,title:"Saktah",surat:"Surah Al-Kahfi; Yasin; Al-Qiyamah; Al-Muthaffifin",ayat:"1–2; 52; 27; 14",juz:"15; 23; 29; 30",desc:"Saktah adalah berhenti sejenak tanpa mengambil napas. Empat lokasi yang dibahas ditampilkan lengkap; pada QS. Al-Kahfi ditampilkan ayat 1 dan 2 secara terpisah.",audio:"06.Saktah.mp3",keywords:["saktah","iwaja","qayyima","marqadina","yasin","qiyamah","mutaffifin","kahfi"],verses:[{ref:"QS. Al-Kahfi 18:1",number:"١",text:"ٱلْحَمْدُ لِلَّهِ ٱلَّذِيٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَاۜ",focus:["عِوَجَاۜ"]},{ref:"QS. Al-Kahfi 18:2",number:"٢",text:"قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا",focus:["قَيِّمًا"]},{ref:"QS. Yasin 36:52",number:"٥٢",text:"قَالُوا۟ يَٰوَيْلَنَا مَن بَعَثَنَا مِن مَّرْقَدِنَاۜ هَٰذَا مَا وَعَدَ ٱلرَّحْمَٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ",focus:["مَّرْقَدِنَاۜ هَٰذَا"]},{ref:"QS. Al-Qiyamah 75:27",number:"٢٧",text:"وَقِيلَ مَنْ ۜ رَاقٍ",focus:["مَنْ ۜ رَاقٍ"]},{ref:"QS. Al-Muthaffifin 83:14",number:"١٤",text:"كَلَّا بَلْۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ",focus:["كَلَّا بَلْۜ رَانَ"]}]},
      {id:8,title:"Al-'Ankabut — Ittakhadzat",surat:"Surah Al-'Ankabut",ayat:"41",juz:"20",desc:"Jika dibaca waqaf, lafaz الْعَنْكَبُوتْ ۚ اتَّخَذَتْ dibaca dengan berhenti pada lafaz pertama. Jika dibaca washal, lafaz الْعَنْكَبُوتِ اتَّخَذَتْ dibaca bersambung tanpa mengubahnya menjadi bentuk waqaf.",audio:"07.Ankabut ittakhadzat baita.mp3",keywords:["ankabut","ittakhadzat","baita","waqaf","washal"],verses:[{ref:"QS. Al-'Ankabut 29:41",number:"٤١",text:"مَثَلُ ٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ أَوْلِيَآءَ كَمَثَلِ ٱلْعَنكَبُوتِ ٱتَّخَذَتْ بَيْتًا ۖ وَإِنَّ أَوْهَنَ ٱلْبُيُوتِ لَبَيْتُ ٱلْعَنكَبُوتِ ۖ لَوْ كَانُوا۟ يَعْلَمُونَ",focus:["ٱلْعَنكَبُوتِ ٱتَّخَذَتْ"]}]},
      {id:9,title:"Matsalan — Alhamdulillah",surat:"Surah Az-Zumar",ayat:"29",juz:"23",desc:"Materi ini membahas contoh lafaz مَثَلًا الْحَمْدُ لِلَّهِ. Jika dibaca waqaf, bacaan berhenti pada lafaz مَثَلًا sebelum melanjutkan bacaan. Jika dibaca washal, bacaan dilanjutkan tanpa berhenti di antara lafaz.",audio:"08.hal yastawiyani matsala.mp3",keywords:["hal yastawiyani","matsala","masalan","alhamdu lillah","zumar","waqaf","washal"],verses:[{ref:"QS. Az-Zumar 39:29",number:"٢٩",text:"ضَرَبَ ٱللَّهُ مَثَلًا رَّجُلًا فِيهِ شُرَكَآءُ مُتَشَٰكِسُونَ وَرَجُلًا سَلَمًا لِّرَجُلٍ هَلْ يَسْتَوِيَانِ مَثَلًا ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ",focus:["مَثَلًا ۚ ٱلْحَمْدُ لِلَّهِ"]}]},
      {id:10,title:"Tas-hil — A'a'jamiyyun",surat:"Surah Fussilat",ayat:"44",juz:"24",desc:"Tas-hil berarti meringankan bacaan hamzah kedua, yaitu membacanya di antara hamzah dan alif. Contoh terdapat pada lafaz ءَا۬عْجَمِيٌّۭ.",audio:"09.Aa'jamiyyun.mp3",keywords:["a'jamiyyun","tas-hil","tashil","fussilat"],verses:[{ref:"QS. Fussilat 41:44",number:"٤٤",text:"وَلَوْ جَعَلْنَٰهُ قُرْءَانًا أَعْجَمِيًّا لَّقَالُوا۟ لَوْلَا فُصِّلَتْ ءَايَٰتُهُۥٓ ۖ ءَا۬عْجَمِيٌّ وَعَرَبِيٌّ ۗ قُلْ هُوَ لِلَّذِينَ ءَامَنُوا۟ هُدًى وَشِفَآءٌ ۖ وَٱلَّذِينَ لَا يُؤْمِنُونَ فِيٓ ءَاذَانِهِمْ وَقْرٌ وَهُوَ عَلَيْهِمْ عَمًى ۚ أُو۟لَٰٓئِكَ يُنَادَوْنَ مِن مَّكَانٍ بَعِيدٍ",focus:["ءَا۬عْجَمِيٌّ"]}]},
      {id:11,title:"Mad Badal — Am Lahum Syirkun fis-Samawati",surat:"Surah Al-Ahqaf",ayat:"4",juz:"26",desc:"Materi ini membahas kaidah Mad Badal pada contoh إِيتُونِي dan variasi penulisan hamzah awal.<br><br>1. Terdapat bentuk tulisan dengan hamzah pertama berkasrah dan bentuk tanpa kasrah. Keduanya dibaca sama, yaitu إِيتُونِي. Kaidah ini disebut Mad Badal.<br><br>2. Cara membaca waqaf pada lafaz فِي السَّمَاوَاتِ ۚ إِيتُونِي berbeda dengan washal. Ketika washal, bentuk bacaan menjadi فِي السَّمَاوَاتِ ائْتُونِي, dengan perubahan cara membaca ya' sukun menjadi hamzah sukun sebagaimana diterangkan dalam materi.",audio:"10.am lahum syirkun fis-samâwâti.mp3",keywords:["am lahum","syirkun","samawati","samâwâti","ituni","mad badal","ahqaf","waqaf","washal"],verses:[{ref:"QS. Al-Ahqaf 46:4",number:"٤",text:"قُلْ أَرَءَيْتُم مَّا تَدْعُونَ مِن دُونِ ٱللَّهِ أَرُونِي مَاذَا خَلَقُوا۟ مِنَ ٱلْأَرْضِ أَمْ لَهُمْ شِرْكٌ فِي ٱلسَّمَٰوَٰتِ ۖ ائْتُونِي بِكِتَٰبٍ مِّن قَبْلِ هَٰذَآ أَوْ أَثَٰرَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَٰدِقِينَ",focus:["ائْتُونِي"]}]},
      {id:12,title:"Naql — Bi'sal Ismu",surat:"Surah Al-Hujurat",ayat:"11",juz:"26",desc:"Nama bacaan ini adalah Naql. Pada bentuk tulisan tertentu, alif setelah lam tidak dibaca sebagaimana tulisan biasa, sehingga harakat dipindahkan dan bacaan menjadi l-ismu.",audio:"11.bi salismu fusuqu ba dal iman.mp3",keywords:["naql","bi salismu","ismu","fusuqu","ba'dal iman","hujurat"],verses:[{ref:"QS. Al-Hujurat 49:11",number:"١١",text:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًا مِّنْهُمْ وَلَا نِسَآءٌ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًا مِّنْهُنَّ ۖ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ ۖ بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ بَعْدَ ٱلْإِيمَٰنِ ۚ وَمَن لَّمْ يَتُبْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ",focus:["بِئْسَ ٱلِٱسْمُ"]}]},
      {id:13,title:"Salasila dan Qawarira",surat:"Surah Al-Insan",ayat:"4; 15–16",juz:"29",desc:"Salasila: ketika washal, bunyi akhir dibaca pendek; ketika waqaf atau terpaksa berhenti, ikuti ketentuan bacaan yang dipelajari. Qawarira: pada akhir ayat 15 RAA dibaca panjang saat waqaf, sedangkan awal ayat 16 dibaca pendek; jika washal keduanya dibaca pendek. Jika terpaksa berhenti pada lafaz Qawarira ayat 16, ikuti penjelasan materi tentang sukun pada RAA kedua lalu ulangi bacaan sesuai ketentuan.",audio:"12.salâsilâ wa aghlâlâw wa sa'îrâ.mp3",audioExtra:"13.qawârîrâ.mp3",keywords:["salasila","aghlala","sa'ira","qawarira","insan","waqaf","washal","terpaksa berhenti"],verses:[{ref:"QS. Al-Insan 76:4",number:"٤",text:"إِنَّآ أَعْتَدْنَا لِلْكَٰفِرِينَ سَلَٰسِلَا۟ وَأَغْلَٰلًا وَسَعِيرًا",focus:["سَلَٰسِلَا۟"]},{ref:"QS. Al-Insan 76:15",number:"١٥",text:"وَيُطَافُ عَلَيْهِم بِـَٔانِيَةٍ مِّن فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَا۠",focus:["قَوَارِيرَا۠"]},{ref:"QS. Al-Insan 76:16",number:"١٦",text:"قَوَارِيرَا مِن فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا",focus:["قَوَارِيرَا"]}]}

    function getProfilePhoto() {
        return AppState.user && AppState.user.profilePhoto ? AppState.user.profilePhoto : null;
    }

    function avatarMarkup(user, size = 44) {
        const photo = getProfilePhoto();
        const initial = (user && user.name ? user.name : 'A').charAt(0).toUpperCase();
        if(photo) {
            return `<img class="avatar profile-photo" src="${photo}" alt="Foto profil" style="width:${size}px;height:${size}px;" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar',textContent:'${initial}'}));">`;
        }
        return `<div class="avatar" style="width:${size}px;height:${size}px;">${initial}</div>`;
    }

    function closeProfileMenu() {
        const menu = document.getElementById('profile-menu');
        if(menu) menu.classList.remove('active');

    function handleProfilePhotoInput(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if(!file) return;

        if(!PROFILE_PHOTO_TYPES.includes(file.type)) {
            alert('Format foto belum didukung. Gunakan JPG, PNG, atau WEBP.');
            return;
        }
        if(file.size > PROFILE_PHOTO_MAX_BYTES) {
            alert('Ukuran foto terlalu besar. Gunakan foto maksimal 5 MB.');
            return;
        }

        const modal = document.getElementById('profile-crop-modal');
        const img = document.getElementById('profile-crop-image');
        const zoom = document.getElementById('profile-crop-zoom');
        const preview = document.getElementById('profile-crop-preview');
        if(!modal || !img) return;

        if(profileCropState.objectUrl) URL.revokeObjectURL(profileCropState.objectUrl);
        const objectUrl = URL.createObjectURL(file);
        profileCropState = {
            image: img,
            objectUrl,
            scale: 1,
            minScale: 1,
            x: 0,
            y: 0,
            dragging: false,
            startX: 0,
            startY: 0,
            startImageX: 0,
            startImageY: 0
        };

        img.onload = () => {
            const stage = document.getElementById('profile-crop-stage');
            const baseScale = Math.max(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
            profileCropState.minScale = baseScale;
            profileCropState.scale = baseScale;
            profileCropState.x = 0;
            profileCropState.y = 0;
            zoom.min = baseScale.toFixed(4);
            zoom.max = (baseScale * 3).toFixed(4);
            zoom.step = Math.max(baseScale / 100, 0.001).toFixed(4);
            zoom.value = baseScale;
            preview.style.display = 'none';
            updateCropTransform();
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
        };
        img.src = objectUrl;
    }

    function updateCropTransform() {
        const img = profileCropState.image;
        if(!img) return;
        img.style.width = `${img.naturalWidth * profileCropState.scale}px`;
        img.style.height = `${img.naturalHeight * profileCropState.scale}px`;
        img.style.transform = `translate(calc(-50% + ${profileCropState.x}px), calc(-50% + ${profileCropState.y}px))`;
        renderProfileCropPreview();
    }

    function clampCropPosition() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        if(!stage || !img) return;
        const renderedW = img.naturalWidth * profileCropState.scale;
        const renderedH = img.naturalHeight * profileCropState.scale;
        const maxX = Math.max(0, (renderedW - stage.clientWidth) / 2);
        const maxY = Math.max(0, (renderedH - stage.clientHeight) / 2);
        profileCropState.x = Math.max(-maxX, Math.min(maxX, profileCropState.x));
        profileCropState.y = Math.max(-maxY, Math.min(maxY, profileCropState.y));
    }

    function renderProfileCropPreview() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        const preview = document.getElementById('profile-crop-preview');
        if(!stage || !img || !img.naturalWidth || !preview) return;

        clampCropPosition();

        const canvas = document.createElement('canvas');
        const outputSize = 256;
        canvas.width = outputSize;
        canvas.height = outputSize;
        const ctx = canvas.getContext('2d');

        const scale = profileCropState.scale;
        const renderedW = img.naturalWidth * scale;
        const renderedH = img.naturalHeight * scale;
        const stageSize = stage.clientWidth;
        const imageLeft = (stageSize - renderedW) / 2 + profileCropState.x;
        const imageTop = (stageSize - renderedH) / 2 + profileCropState.y;
        const sourceX = Math.max(0, (0 - imageLeft) / scale);
        const sourceY = Math.max(0, (0 - imageTop) / scale);
        const sourceSize = stageSize / scale;

        ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, outputSize, outputSize);
        preview.src = canvas.toDataURL('image/jpeg', 0.9);
        preview.style.display = 'block';
    }

    function saveProfileCrop() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        if(!stage || !img || !img.naturalWidth) return;

        clampCropPosition();

        const canvas = document.createElement('canvas');
        const outputSize = 512;
        canvas.width = outputSize;
        canvas.height = outputSize;
        const ctx = canvas.getContext('2d');

        const scale = profileCropState.scale;
        const renderedW = img.naturalWidth * scale;
        const renderedH = img.naturalHeight * scale;
        const stageSize = stage.clientWidth;
        const imageLeft = (stageSize - renderedW) / 2 + profileCropState.x;
        const imageTop = (stageSize - renderedH) / 2 + profileCropState.y;
        const sourceX = Math.max(0, (0 - imageLeft) / scale);
        const sourceY = Math.max(0, (0 - imageTop) / scale);
        const sourceSize = stageSize / scale;

        ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, outputSize, outputSize);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.88);

        if(!AppState.user) AppState.user = { name: 'Aulia', gender: 'L', isLoggedIn: true };
        AppState.user.profilePhoto = dataUrl;

    }

        profileCropState = {

            x: 0, y: 0, dragging: false, startX: 0, startY: 0,

        };

    function setupProfileCropInteractions() {
        const stage = document.getElementById('profile-crop-stage');
        const img = document.getElementById('profile-crop-image');
        const zoom = document.getElementById('profile-crop-zoom');
        if(!stage || !img || !zoom || stage.dataset.bound === 'true') return;
        stage.dataset.bound = 'true';

        zoom.addEventListener('input', () => {
            const oldScale = profileCropState.scale;
            const newScale = Number(zoom.value);
            if(!oldScale) return;
            const ratio = newScale / oldScale;
            profileCropState.x *= ratio;
            profileCropState.y *= ratio;
            profileCropState.scale = newScale;
            clampCropPosition();
            updateCropTransform();
        });

        const startDrag = (e) => {
            if(!profileCropState.image) return;
            profileCropState.dragging = true;
            profileCropState.startX = e.clientX;
            profileCropState.startY = e.clientY;
            profileCropState.startImageX = profileCropState.x;
            profileCropState.startImageY = profileCropState.y;
            img.classList.add('dragging');
            if(e.pointerId !== undefined) stage.setPointerCapture(e.pointerId);
        };
        const moveDrag = (e) => {
            if(!profileCropState.dragging) return;
            profileCropState.x = profileCropState.startImageX + (e.clientX - profileCropState.startX);
            profileCropState.y = profileCropState.startImageY + (e.clientY - profileCropState.startY);
            clampCropPosition();
            updateCropTransform();
        };
        const endDrag = () => {
            profileCropState.dragging = false;
            img.classList.remove('dragging');
        };

        stage.addEventListener('pointerdown', startDrag);
        stage.addEventListener('pointermove', moveDrag);
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);
        stage.addEventListener('pointerleave', endDrag);
    }

    const MASCOT_GIF_DURATION_MS = 14270;
    const MASCOT_GIF_TOLERANCE_MS = 120;
    const MASCOT_FADE_MS = 300;

    let mascotWelcome = {
        shownThisLoad: false,
        active: false,

        gifTimer: null,
        audioEnded: false,
        gifFinished: false,
        closing: false,

    function getMascotWelcomeOverlay() {
        return document.getElementById('mascot-welcome-overlay');
    }

    function getMascotWelcomeGif() {
        return document.getElementById('mascot-welcome-gif');
    }

    function removeMascotFallbackListener() {
        if(!mascotWelcome.fallbackHandler) return;
        ['pointerdown', 'touchstart', 'keydown'].forEach(eventName => {
            document.removeEventListener(eventName, mascotWelcome.fallbackHandler);
        });
        mascotWelcome.fallbackHandler = null;
        mascotWelcome.fallbackInteractionBound = false;
    }

    function cleanupMascotWelcome() {
        if(mascotWelcome.gifTimer) {
            clearTimeout(mascotWelcome.gifTimer);
            mascotWelcome.gifTimer = null;
        }

        removeMascotFallbackListener();

        if(mascotWelcome.audio) {
            mascotWelcome.audio.onended = null;
            mascotWelcome.audio.onerror = null;
            mascotWelcome.audio = null;
        }

        const gif = getMascotWelcomeGif();
        if(gif) gif.removeAttribute('src');

        mascotWelcome.active = false;
        mascotWelcome.audioEnded = false;
        mascotWelcome.gifFinished = false;
        mascotWelcome.closing = false;

        const overlay = getMascotWelcomeOverlay();
        if(overlay) {
            overlay.classList.remove('active', 'closing');
            overlay.setAttribute('aria-hidden', 'true');
            overlay.style.pointerEvents = 'none';
        }
    }

    function finishMascotGif() {
        if(!mascotWelcome.active || mascotWelcome.gifFinished || mascotWelcome.closing) return;

        mascotWelcome.gifFinished = true;
        mascotWelcome.closing = true;

        const overlay = getMascotWelcomeOverlay();
        const gif = getMascotWelcomeGif();

        if(gif) {
            gif.style.opacity = '0';
            gif.style.transition = `opacity ${MASCOT_FADE_MS}ms ease`;
        }
        if(overlay) {
            overlay.classList.remove('active');
            overlay.classList.add('closing');
            overlay.setAttribute('aria-hidden', 'true');
            overlay.style.pointerEvents = 'none';
        }

        // GIF/overlay end independently. DO NOT pause or stop the audio here.
        setTimeout(() => {
            if(gif) {
                gif.removeAttribute('src');
                gif.style.opacity = '';
                gif.style.transition = '';
            }
            if(overlay) overlay.classList.remove('closing');
            mascotWelcome.active = false;
            mascotWelcome.closing = false;
            mascotWelcome.gifTimer = null;
        }, MASCOT_FADE_MS);
    }

    function bindMascotAutoplayFallback() {
        if(mascotWelcome.fallbackInteractionBound) return;
        mascotWelcome.fallbackInteractionBound = true;

        const tryStartAudio = () => {
            const audio = mascotWelcome.audio;
            if(!audio || mascotWelcome.audioEnded || !audio.paused) return;

            const playPromise = audio.play();
            if(playPromise) {
                playPromise.catch(() => {
                    // Browser may continue to block autoplay. Do not loop or create another audio instance.
                });
            }
        };

        mascotWelcome.fallbackHandler = tryStartAudio;
        ['pointerdown', 'touchstart', 'keydown'].forEach(eventName => {
            document.addEventListener(eventName, tryStartAudio, { passive: true });
        });
    }

    function showMascotWelcome() {
        if(mascotWelcome.shownThisLoad || mascotWelcome.active) return;

        const overlay = getMascotWelcomeOverlay();
        const gif = getMascotWelcomeGif();
        if(!overlay || !gif) return;

        mascotWelcome.shownThisLoad = true;
        mascotWelcome.active = true;
        mascotWelcome.audioEnded = false;
        mascotWelcome.gifFinished = false;
        mascotWelcome.closing = false;

        overlay.classList.remove('closing');
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        overlay.style.pointerEvents = 'auto';

        gif.style.opacity = '1';
        gif.style.transition = '';
        gif.removeAttribute('src');
        void gif.offsetWidth;
        gif.src = gif.getAttribute('data-src') || 'sambutan maskot.gif';

        // Exactly one audio instance for this page load.
        const audio = new Audio('sambutan audio.mp3');
        audio.preload = 'auto';
        mascotWelcome.audio = audio;

        audio.onended = () => {
            mascotWelcome.audioEnded = true;
            removeMascotFallbackListener();
            mascotWelcome.audio = null;
        };
        audio.onerror = () => {
            mascotWelcome.audioEnded = true;
            removeMascotFallbackListener();
            mascotWelcome.audio = null;
        };

        // Start GIF and audio in the same activation path.
        const playPromise = audio.play();
        if(playPromise) {
            playPromise.catch(() => {
                // Autoplay blocked: keep the GIF/overlay timeline unchanged.
                // The same audio instance can start after the first user interaction.
            });
        }
        bindMascotAutoplayFallback();

        // The GIF has a fixed visual duration. Audio duration NEVER controls this timer.
        mascotWelcome.gifTimer = setTimeout(
            finishMascotGif,
            MASCOT_GIF_DURATION_MS + MASCOT_GIF_TOLERANCE_MS
        );
    }

    function stopAudio() {
        if(AppState.currentAudioNode) {
            AppState.currentAudioNode.pause();
            if(AppState.currentAudioPlayer) {
                const icon = AppState.currentAudioPlayer.querySelector('.play-btn i');
                if(icon) icon.className = 'ph-fill ph-play';
            }
            AppState.currentAudioNode = null;
            AppState.currentAudioPlayer = null;
        }
    }

    function toggleAudio(src, playerContainer) {
        const icon = playerContainer.querySelector('.play-btn i');
        const progressBar = playerContainer.querySelector('.custom-slider');
        const timeDisplay = playerContainer.querySelector('.current-time');
        
        if(AppState.currentAudioNode && AppState.currentAudioNode.src.endsWith(src) && !AppState.currentAudioNode.paused) {
            AppState.currentAudioNode.pause();
            icon.className = 'ph-fill ph-play';
            return;
        }

        stopAudio();

        AppState.currentAudioNode = new Audio(`assets/${src}`); 
        AppState.currentAudioNode.onerror = () => {
            console.warn(`File audio '${src}' tidak ditemukan lokal.`);
            icon.className = 'ph-fill ph-play';
        };
        
        AppState.currentAudioPlayer = playerContainer;
        icon.className = 'ph-fill ph-pause';
        
        AppState.currentAudioNode.play().catch(e => {
            console.log("Autoplay / audio play handled:", e);
            icon.className = 'ph-fill ph-play';
        });

        addXP(2); // Audio reward

        AppState.currentAudioNode.ontimeupdate = () => {
            const ratio = AppState.currentAudioNode.currentTime / AppState.currentAudioNode.duration;
            if(progressBar) progressBar.value = ratio ? ratio * 100 : 0;
            if(timeDisplay) timeDisplay.innerText = formatTime(AppState.currentAudioNode.currentTime);
        };
        
        AppState.currentAudioNode.onended = () => {
            icon.className = 'ph-fill ph-play';
            if(progressBar) progressBar.value = 0;
            if(timeDisplay) timeDisplay.innerText = "0:00";
        };
    }

    function formatTime(seconds) {
        if(isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' + s : s}`;
    }

    function escapeHtmlText(value) {
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // All Arabic verse text is stored as plain text. Only the trusted focus strings
    // are wrapped during rendering; no source verse string is interpreted as HTML.
    function renderArabic(mat) {
        return (mat.verses || []).map(verse => {
            let remaining = verse.text;
            const pieces = [];
            const focusTerms = [...(verse.focus || [])].sort((a, b) => b.length - a.length);
            while (remaining.length) {
                let bestIndex = -1, bestTerm = '';
                for (const term of focusTerms) {
                    const index = remaining.indexOf(term);
                    if (index !== -1 && (bestIndex === -1 || index < bestIndex || (index === bestIndex && term.length > bestTerm.length))) {
                        bestIndex = index; bestTerm = term;
                    }
                }
                if (bestIndex === -1) { pieces.push(escapeHtmlText(remaining)); break; }
                if (bestIndex > 0) pieces.push(escapeHtmlText(remaining.slice(0, bestIndex)));
                pieces.push('<span class="highlight">' + escapeHtmlText(bestTerm) + '</span>');
                remaining = remaining.slice(bestIndex + bestTerm.length);
            }
            return '<div class="quran-verse"><span class="quran-verse-ref">' + escapeHtmlText(verse.ref) + '</span><span class="quran-verse-text">' + pieces.join('') + '<span class="quran-verse-number">۝ ' + escapeHtmlText(verse.number) + '</span></span></div>';
        }).join('');
    }

    let quizState = { currentIdx: 0, score: 0, answers: [], questions: [] };

    function shuffleQuizQuestions(source) {
        const shuffled = source.slice();
        for(let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startQuiz() {
        quizState = { currentIdx: 0, score: 0, answers: [], questions: shuffleQuizQuestions(QUIZ_QUESTIONS) };
        navigate('quiz-run');
    }

    function renderQuizRun() {
        const q = quizState.questions[quizState.currentIdx];
        if(!q) { navigate('quiz-result'); return ''; }
        const answered = quizState.answers.find(a => a.questionId === q.id);
        const pct = (quizState.currentIdx / QUIZ_QUESTIONS.length) * 100;
        let html = `
            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:6px;">
                <span>Soal ${quizState.currentIdx + 1} dari ${QUIZ_QUESTIONS.length}</span>
                <span>Urutan diacak</span>
            </div>
            <div class="progress-container" style="margin-bottom:20px;"><div class="progress-bar" style="width:${pct}%;"></div></div>
            <div class="card" style="margin-bottom:16px;">
                <div style="font-size:12px; color:var(--primary); font-weight:700; margin-bottom:8px;">SOAL ${q.id}</div>
                <h2 style="margin-bottom:0; font-size:18px; line-height:1.6;">${q.question}</h2>
            </div>
            <div id="quiz-options">
        `;
        Object.entries(q.options).forEach(([letter,opt]) => {
            html += `<div class="quiz-option ${answered && answered.answer === letter ? 'selected' : ''}" onclick="selectQuizAnswer('${letter}')"><span><b>${letter}.</b> ${opt}</span></div>`;
        });
        html += `</div>
            <button id="btn-next-quiz" class="btn btn-primary" style="margin-top:20px; opacity:${answered ? '1' : '0.5'}; pointer-events:${answered ? 'auto' : 'none'};" onclick="nextQuizQuestion()">
                ${quizState.currentIdx === QUIZ_QUESTIONS.length - 1 ? 'Selesai & Lihat Hasil' : 'Lanjutkan'}
            </button>`;
        return html;
    }

    function selectQuizAnswer(letter) {
        const q = quizState.questions[quizState.currentIdx];
        if(!q) return;
        document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
        const index = ['A','B','C','D'].indexOf(letter);
        const selected = document.querySelectorAll('.quiz-option')[index];
        if(selected) selected.classList.add('selected');
        const existing = quizState.answers.findIndex(a => a.questionId === q.id);
        const record = { questionId: q.id, answer: letter };
        if(existing >= 0) quizState.answers[existing] = record;
        else quizState.answers.push(record);
        const btn = document.getElementById('btn-next-quiz');
        if(btn) { btn.style.opacity='1'; btn.style.pointerEvents='auto'; }
    }

    function nextQuizQuestion() {
        const q = quizState.questions[quizState.currentIdx];
        if(!q) return;
        const record = quizState.answers.find(a => a.questionId === q.id);
        if(!record) return;

        if(record.answer === q.correctAnswer) { quizState.score++; addXP(10); }
        quizState.currentIdx++;

        if(quizState.currentIdx >= QUIZ_QUESTIONS.length) {
            const pct = Math.round((quizState.score / QUIZ_QUESTIONS.length) * 100);
            if(!Array.isArray(AppState.progress.quizScores)) AppState.progress.quizScores = [];
            AppState.progress.quizScores.push({ score: quizState.score, total: QUIZ_QUESTIONS.length, pct, date: new Date().toISOString() });
            if(pct === 100 && !AppState.progress.achievements.includes('quiz_master')) AppState.progress.achievements.push('quiz_master');
            saveProgress();
            navigate('quiz-result', { score: quizState.score, pct });
        } else {
            navigate('quiz-run');
        }
    }

    function renderQuizResult(params = null) {
        const total = QUIZ_QUESTIONS.length;
        const score = params && Number.isFinite(params.score) ? params.score : quizState.score;
        const pct = params && Number.isFinite(params.pct) ? params.pct : Math.round((score / total) * 100);
        const wrong = total - score;

        const review = quizState.questions.map((q,index) => {
            const record = quizState.answers.find(a => a.questionId === q.id);
            const userAnswer = record ? record.answer : '-';
            const correct = userAnswer === q.correctAnswer;
            const userText = userAnswer === '-' ? 'Tidak dijawab' : `${userAnswer}. ${q.options[userAnswer]}`;
            return `
                <div class="card quiz-review-card">
                    <div class="quiz-review-header">
                        <div><div style="font-size:12px;color:var(--primary);font-weight:700;">SOAL ${index+1}</div><div style="font-size:12px;color:var(--text-muted);">Nomor soal asli: ${q.id}</div></div>
                        <span class="quiz-status ${correct ? 'correct':'wrong'}">${correct ? 'BENAR':'SALAH'}</span>
                    </div>
                    <div class="quiz-review-question">${q.question}</div>
                    <div class="quiz-review-label">Jawaban Anda</div>
                    <div class="quiz-review-answer">${userText}</div>
                    <div class="quiz-review-label">Jawaban Benar</div>
                    <div class="quiz-review-answer"><b>${q.correctAnswer}. ${q.options[q.correctAnswer]}</b></div>
                    <div class="quiz-explanation"><b>Pembahasan:</b><br>${q.explanation}</div>
                    <div class="quiz-option-explanations">
                        <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Mengapa pilihan lain salah?</div>
                        ${Object.entries(q.options).map(([letter]) => `<div class="quiz-option-explanation"><b>${letter}.</b> ${q.optionExplanations[letter]}</div>`).join('')}
                    </div>
                </div>`;
        }).join('');

        return `
            <div>
                <div class="fullscreen-view" style="position:static;min-height:auto;background:transparent;padding:0;">
                    <h1 style="font-size:48px;margin-bottom:0;">${pct===100?'🎉':'📚'}</h1>
                    <h2 style="margin-top:12px;">Hasil Latihan</h2>
                    <div style="font-size:52px;font-weight:bold;color:var(--primary);margin:12px 0;">${pct}</div>
                    <p style="font-size:14px;margin-bottom:4px;">Nilai Akhir</p>
                    <p style="font-size:14px;">Benar: <b>${score} dari ${total}</b> &nbsp;•&nbsp; Salah: <b>${wrong} dari ${total}</b></p>
                    <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;width:100%;margin:20px auto 0;">
                        <button class="btn btn-primary" onclick="startQuiz()">Ulangi Latihan</button>
                        <button class="btn btn-secondary" onclick="navigate('home')">Kembali ke Home</button>
                    </div>
                </div>
                <div style="margin-top:28px;">
                    <h2>Pembahasan 20 Soal</h2>
                    <p>Jawaban Anda, kunci jawaban, dan alasan setiap pilihan ditampilkan di bawah ini.</p>
                    ${review}
                </div>
            </div>`;
    }

        const pct = Math.round((comp / MATERIALS.length) * 100);

        return `
            <h2>Progress & Achievement</h2>
            <p>Statistik belajar dan badge penghargaan Anda.</p>

            <div class="card" style="margin-top:16px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px;">
                    <div>Level ${lvl.level} — ${lvl.name}</div>
                    <div><b>${p.xp} / ${lvl.max} XP</b></div>
                </div>
                <div style="width:100%; background:rgba(255,255,255,0.25); height:8px; border-radius:4px; overflow:hidden;">
                    <div style="background:var(--gold); height:100%; width:${Math.min(100, (p.xp/lvl.max)*100)}%;"></div>
                </div>
                <div style="margin-top:10px; font-size:12px; color:rgba(255,255,255,0.85);">🔥 Streak Belajar: <b>${p.streak} Hari Berturut-turut</b></div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px;">
                    <span style="font-weight:600;">Penyelesaian Materi</span>
                    <span style="color:var(--primary); font-weight:bold;">${comp} / ${MATERIALS.length} (${pct}%)</span>
                </div>
                <div class="progress-container"><div class="progress-bar" style="width:${pct}%;"></div></div>
            </div>

            <h3 style="margin-top:20px;">Badge Pencapaian</h3>
            <div class="badge-grid">
                ${ACHIEVEMENTS_DEF.map(a => {
                    const unlocked = p.achievements.includes(a.id);
                    return `
                        <div class="badge-item ${unlocked ? '' : 'locked'}">
                            <div class="badge-icon">${a.icon}</div>
                            <div class="badge-title">${a.title}</div>
                            <div class="badge-desc">${a.desc}</div>
                        </div>
                    `;
                }).join('')}
            </div>

            <h3 style="margin-top:28px;">Papan Peringkat (Demo Lokal)</h3>
            <div class="card" style="padding:0; overflow:hidden;">
                <div style="display:flex; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px;">
                    <span>🥇 <b>Ahmad</b> (Level 4)</span> <span style="color:var(--primary);">1,250 XP</span>
                </div>
                <div style="display:flex; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--primary-light); font-size:13px;">
                    <span>🥈 <b>${AppState.user ? AppState.user.name : 'Anda'}</b> (Level ${lvl.level})</span> <span style="color:var(--primary);"><b>${p.xp} XP</b></span>
                </div>
                <div style="display:flex; justify-content:space-between; padding:10px 14px; font-size:13px;">
                    <span>🥉 <b>Siti</b> (Level 3)</span> <span style="color:var(--primary);">850 XP</span>
                </div>
            </div>
        `;
    }

    function renderProfile() {
        const u = AppState.user || { name: 'Aulia', gender: 'L' };
        const lvl = calculateLevel();
        const photo = getProfilePhoto();
        return `
            <div style="text-align:center; padding:20px 0;">
                <div id="profile-photo-display" style="width:96px; height:96px; margin:0 auto 10px;">
                    ${photo
                        ? `<img class="profile-photo" src="${photo}" alt="Foto profil" style="width:96px;height:96px;">`
                        : `<div style="width:96px;height:96px;border-radius:50%;background:var(--primary);color:white;font-size:36px;display:flex;align-items:center;justify-content:center;">${u.name.charAt(0).toUpperCase()}</div>`
                    }
                </div>
                <h2>${u.name}</h2>
                <p style="font-size:13px;">Level ${lvl.level} • ${lvl.name}</p>
                <input type="file" id="profile-photo-input" accept="image/jpeg,image/png,image/webp" hidden onchange="handleProfilePhotoInput(this)">
                <button class="btn btn-outline" type="button" style="width:auto; padding:8px 16px; margin-top:4px;" onclick="document.getElementById('profile-photo-input').click()">
                    <i class="ph-camera"></i> Ubah Foto
                </button>
                <p style="font-size:11px; margin:8px 0 0;">JPG, PNG, atau WEBP • Maks. 5 MB • Crop 1:1</p>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;">
                    <span>Nama</span> <b>${u.name}</b>
                </div>
                <div style="display:flex; justify-content:space-between; padding:8px 0; font-size:14px;">
                    <span>Total XP</span> <b style="color:var(--primary);">${AppState.progress.xp} XP</b>
                </div>
            </div>
            <button class="btn btn-outline" style="color:var(--error); border-color:var(--error); margin-top:20px;" onclick="doLogout()"><i class="ph-sign-out"></i> Keluar</button>
        `;
    }

    function doLogout() {
        AppState.user = null;
        Storage.remove('user');
        navigate('splash');
    }

    function renderSettings() {
        return `
            <h2>Pengaturan</h2>
            <div class="card" style="margin-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0;">
                    <div><div style="font-weight:600; font-size:14px;">Reset Progress & XP</div><div style="font-size:12px; color:var(--text-muted);">Hapus semua data belajar lokal</div></div>
                    <button class="btn btn-outline" style="width:auto; padding:6px 12px; color:var(--error); border-color:var(--error); font-size:12px;" onclick="confirmReset()">Reset</button>
                </div>
            </div>
        `;
    }

    function confirmReset() {
        if(confirm("Apakah Anda yakin ingin mereset seluruh progress pembelajaran?")) {
            AppState.progress = { completed: [], inProgress: [], quizScores: [], lastMaterial: null, xp: 0, streak: 1, achievements: [] };
            saveProgress();
            alert("Progress berhasil direset.");
            navigate('home');
        }
    }

    function renderAbout() {
        return `
            <h2>Tentang GHORIB SMART</h2>
            <p>GHORIB SMART adalah platform media pembelajaran interaktif yang dirancang untuk membantu memahami bacaan-bacaan Ghorib Al-Qur'an secara terstruktur dan teruji.</p>
            <div class="card" style="margin-top:16px;">
                <h3 style="margin-bottom:8px;">Fitur Unggulan</h3>
                <ul style="padding-left:20px; color:var(--text-muted); font-size:14px; line-height:1.8;">
                    <li>13 Materi Ghorib terstruktur sesuai dokumen standar</li>
                    <li>13 Audio pelafalan resmi (.m4a)</li>
                    <li>AI Camera Scanner untuk memindai lafaz mushaf secara cepat</li>
                    <li>Gamifikasi XP, Level, dan Badge Pencapaian</li>
                </ul>
            </div>
        `;
    }

    function renderFAQ() {
        return `
            <h2>FAQ (Pertanyaan Umum)</h2>
            <div class="card" style="margin-top:16px;">
                <h3 style="font-size:15px; margin-bottom:4px;">Apa itu bacaan Ghorib?</h3>
                <p style="font-size:13px; color:var(--text-muted); margin:0;">Bacaan Ghorib adalah lafaz-lafaz khusus dalam Al-Qur'an yang cara membacanya keluar dari kaidah umum atau membutuhkan cara pelafalan khusus.</p>
            </div>
            <div class="card">
                <h3 style="font-size:15px; margin-bottom:4px;">Bagaimana cara kerja AI Scanner?</h3>
                <p style="font-size:13px; color:var(--text-muted); margin:0;">Arahkan kamera smartphone Anda ke halaman mushaf, lalu sistem akan mendeteksi lafaz Ghorib dan menampilkan popup penjelasan beserta audio pelafalannya.</p>
            </div>
        `;
    }

    // Helper Filter Tab
    window.setTab = function(el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        filterMaterials();
    };

    window.filterMaterials = function() {
        const activeTab = document.querySelector('.tab.active').getAttribute('data-filter');
        const searchQ = document.getElementById('search-mat').value;
        document.getElementById('material-list-container').innerHTML = buildMaterialCards(activeTab, searchQ);
    };

    document.addEventListener('click', (event) => {
        const menu = document.getElementById('profile-menu');
        const wrap = event.target.closest('.profile-menu-wrap');
        if(menu && !wrap) closeProfileMenu();
    });

    document.addEventListener('keydown', (event) => {
        if(event.key === 'Escape') {
            closeProfileMenu();
            closeProfileCrop();
        }
    });

    document.addEventListener('DOMContentLoaded', setupProfileCropInteractions);

    function attachViewListeners(viewId, container, params) {
        if(viewId === 'identity') {
            const btnSave = container.querySelector('#btn-save-identity');
            const inpName = container.querySelector('#inp-name');
            const radios = container.querySelectorAll('.radio-card');
            let selectedGender = null;
            radios.forEach(r => r.onclick = () => {
                radios.forEach(x => x.classList.remove('selected'));
                r.classList.add('selected');
                selectedGender = r.getAttribute('data-val');
            });
            btnSave.onclick = () => {
                if(!inpName.value.trim()) { alert("Mohon isi nama Anda."); return; }
                AppState.user = { name: inpName.value.trim(), gender: selectedGender || 'L', isLoggedIn: false };
                navigate('login');
            };
        }
        if(viewId === 'materials') {
            container.querySelector('#material-list-container').innerHTML = buildMaterialCards('all', '');
        }
    }

    // Initial Load
    navigate('splash');
</script>
</body>
</html>
