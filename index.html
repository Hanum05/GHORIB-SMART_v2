<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghorib Smart - Platform Edukasi & AI Scanner Al-Qur'an</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #0F5C4D;
            --primary-dark: #08483D;
            --primary-light: #E7F3F1;
            --bg-main: #F8F7F2;
            --surface: #FFFFFF;
            --gold: #C9A227;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #2E8B57;
            --warning: #D89B27;
            --error: #C94C4C;
            --border: #E5E7EB;

            --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; 
            --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

            --rad-sm: 8px; --rad-md: 16px; --rad-lg: 24px; --rad-full: 999px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            
            --font-ui: 'Inter', sans-serif;
            --font-arab: 'Amiri', serif;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-ui); background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; outline: none; }
        a { text-decoration: none; color: inherit; }
        input, select { font-family: inherit; }
        
        #app { display: flex; min-height: 100vh; overflow: hidden; }
        #sidebar { display: none; width: var(--sidebar-width); background: var(--surface); border-right: 1px solid var(--border); flex-direction: column; padding: var(--sp-6); z-index: 50; }
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; padding-bottom: 90px; }
        #bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: var(--sp-2) var(--sp-4); justify-content: space-between; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 16px); }
        
        .view { display: none; animation: fadeIn 0.3s ease; padding: var(--sp-4); max-width: 800px; margin: 0 auto; width: 100%; }
        .view.active { display: block; }
        .fullscreen-view { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: var(--sp-6); text-align: center; background: var(--surface); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: var(--sp-2); }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: var(--sp-2); }
        h3 { font-size: 16px; font-weight: 600; }
        p { color: var(--text-muted); margin-bottom: var(--sp-4); }
        .text-arab { font-family: var(--font-arab); font-size: 32px; line-height: 2; direction: rtl; text-align: right; margin: var(--sp-6) 0; }
        .highlight { color: var(--primary); font-weight: bold; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); padding: 12px 24px; border-radius: var(--rad-full); font-weight: 600; transition: all 0.2s; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }
        .btn-secondary { background: var(--primary-light); color: var(--primary); }
        .btn-outline { border: 1px solid var(--border); color: var(--text-main); }
        
        .card { background: var(--surface); border-radius: var(--rad-md); padding: var(--sp-4); box-shadow: var(--shadow-sm); margin-bottom: var(--sp-4); border: 1px solid var(--border); }
        .card-primary { background: var(--primary); color: white; }
        .card-primary p, .card-primary .text-muted { color: rgba(255,255,255,0.8); }

        .input-group { margin-bottom: var(--sp-4); text-align: left; width: 100%; }
        .input-group label { display: block; margin-bottom: var(--sp-2); font-weight: 500; font-size: 14px; }
        .input-control { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--rad-sm); font-size: 16px; transition: border 0.2s; }
        .input-control:focus { border-color: var(--primary); outline: none; }
        
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
        .radio-card { border: 1px solid var(--border); border-radius: var(--rad-sm); padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .radio-card.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); color: var(--text-muted); font-size: 12px; padding: var(--sp-2); border-radius: var(--rad-sm); flex: 1; }
        .nav-item i { font-size: 24px; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        
        .sidebar-item { display: flex; align-items: center; gap: var(--sp-3); padding: 12px 16px; color: var(--text-muted); font-weight: 500; border-radius: var(--rad-sm); margin-bottom: var(--sp-2); transition: all 0.2s; }
        .sidebar-item:hover { background: var(--bg-main); }
        .sidebar-item.active { background: var(--primary-light); color: var(--primary); }
        .sidebar-item i { font-size: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-6); padding-top: var(--sp-4); }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid var(--primary); }

        .progress-container { width: 100%; background: var(--border); border-radius: var(--rad-full); height: 8px; overflow: hidden; margin-top: var(--sp-2); }
        .progress-bar { height: 100%; background: var(--primary); border-radius: var(--rad-full); transition: width 0.5s ease; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
        .quick-action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2); background: var(--surface); padding: var(--sp-4); border-radius: var(--rad-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); color: var(--text-main); font-weight: 500; font-size: 14px; text-align: center; cursor: pointer; }
        .quick-action i { font-size: 28px; color: var(--primary); }

        .tabs { display: flex; gap: var(--sp-2); overflow-x: auto; padding-bottom: var(--sp-2); margin-bottom: var(--sp-4); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: var(--rad-full); background: var(--surface); border: 1px solid var(--border); font-size: 14px; white-space: nowrap; color: var(--text-muted); cursor: pointer; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .material-card { display: flex; align-items: center; gap: var(--sp-4); }
        .material-num { width: 48px; height: 48px; border-radius: var(--rad-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; flex-shrink: 0; }
        .material-info { flex: 1; }
        .material-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: var(--sp-1); }
        .status-badge { font-size: 10px; padding: 2px 8px; border-radius: var(--rad-full); background: var(--bg-main); color: var(--text-muted); }
        .status-badge.selesai { background: #dcfce7; color: var(--success); }
        .status-badge.sedang { background: #fef3c7; color: var(--warning); }

        .audio-player { background: var(--primary-light); border-radius: var(--rad-md); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); margin: var(--sp-4) 0; }
        .audio-controls { display: flex; align-items: center; gap: var(--sp-3); }
        .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
        .track-info { flex: 1; }
        .time-display { font-size: 12px; color: var(--primary-dark); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .custom-slider { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(15, 92, 77, 0.2); border-radius: 4px; outline: none; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; }

        .quiz-option { padding: 16px; border: 2px solid var(--border); border-radius: var(--rad-md); margin-bottom: var(--sp-3); cursor: pointer; transition: all 0.2s; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .quiz-option.selected { border-color: var(--primary); background: var(--primary-light); }
        .quiz-option.correct { border-color: var(--success); background: #dcfce7; }
        .quiz-option.wrong { border-color: var(--error); background: #fee2e2; }
        
        .mascot-container { width: 180px; height: 180px; margin: 0 auto var(--sp-4); background: var(--primary-light); border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 3px solid var(--primary); }
        .mascot-container img { width: 100%; height: 100%; object-fit: cover; }

        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
        .badge-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: 14px; text-align: center; }
        .badge-item.locked { opacity: 0.4; filter: grayscale(100%); }
        .badge-icon { font-size: 32px; margin-bottom: 6px; }
        .badge-title { font-weight: 600; font-size: 13px; }
        .badge-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }


        /* Mobile Profile Menu + Profile Photo Crop */
        .profile-menu-wrap { position: relative; }
        .profile-trigger { cursor: pointer; }
        .profile-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 190px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rad-md);
            box-shadow: var(--shadow-lg);
            padding: 8px;
            z-index: 80;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
        }
        .profile-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .profile-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: var(--rad-sm);
            color: var(--text-main);
            font-size: 14px;
            text-align: left;
        }
        .profile-menu-item:hover, .profile-menu-item:active { background: var(--primary-light); color: var(--primary); }
        .profile-menu-item i { width: 20px; color: var(--primary); font-size: 18px; }
        .profile-photo { object-fit: cover; border-radius: 50%; display: block; }

        #profile-crop-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .68);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 400;
        }
        #profile-crop-modal.active { display: flex; }
        .profile-crop-dialog {
            width: min(100%, 430px);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: var(--surface);
            border-radius: var(--rad-lg);
            padding: var(--sp-6);
            box-shadow: var(--shadow-lg);
        }
        .crop-stage {
            width: min(100%, 360px);
            aspect-ratio: 1 / 1;
            margin: 14px auto;
            position: relative;
            overflow: hidden;
            background: #111827;
            border-radius: var(--rad-md);
            touch-action: none;
            user-select: none;
        }
        .crop-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255,255,255,.9);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
        }
        #profile-crop-image {
            position: absolute;
            left: 50%;
            top: 50%;
            max-width: none;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
            cursor: grab;
        }
        #profile-crop-image.dragging { cursor: grabbing; }
        .crop-controls { display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
        .crop-controls input { flex:1; accent-color: var(--primary); }
        .crop-preview-wrap { text-align:center; margin-top:10px; }
        #profile-crop-preview {
            width:88px;
            height:88px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid var(--primary-light);
            display:none;
            margin:8px auto 0;
        }
        .crop-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }

        /* Scanner UI */
        #scanner-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
        #scanner-view.active { display: flex; }
        .scanner-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; color: white; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
        .scanner-body { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-frame { width: 280px; height: 180px; border: 2px dashed rgba(255,255,255,0.8); border-radius: var(--rad-md); position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; text-align: center; pointer-events: none; }
        
        .detection-highlight { position: absolute; background: rgba(201, 162, 39, 0.45); border: 2px solid var(--gold); border-radius: 6px; padding: 4px 8px; cursor: pointer; animation: pulseHighlight 1.5s infinite; z-index: 5; box-shadow: 0 0 10px rgba(201, 162, 39, 0.8); }
        @keyframes pulseHighlight { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        
        .scanner-footer { padding: 20px; background: rgba(0,0,0,0.85); color: white; text-align: center; position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; }
        .popup-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top-left-radius: var(--rad-lg); border-top-right-radius: var(--rad-lg); padding: var(--sp-6); z-index: 250; box-shadow: 0 -10px 25px rgba(0,0,0,0.25); transform: translateY(100%); transition: transform 0.3s ease; }
        .popup-sheet.active { transform: translateY(0); }

        @media (min-width: 1024px) {
            #bottom-nav { display: none; }
            #sidebar { display: flex; }
            #main-content { padding-bottom: 0; }
            .view { padding: var(--sp-8); max-width: 900px; margin: 0; }
            .desktop-2-col { display: grid; grid-template-columns: 2fr 1fr; gap: var(--sp-8); align-items: start; }
            .sticky-panel { position: sticky; top: var(--sp-8); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Sidebar Desktop -->
    <nav id="sidebar">
        <div style="margin-bottom: 32px; font-weight: bold; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px;">
            <i class="ph-fill ph-book-open-text"></i> GHORIB SMART
        </div>
        <div class="sidebar-links"></div>
    </nav>

    <main id="main-content"></main>

    <!-- Bottom Nav Mobile -->
    <nav id="bottom-nav"></nav>
</div>

<!-- AI Camera Scanner Overlay -->
<div id="scanner-view">
    <div class="scanner-header">
        <button onclick="closeScanner()" style="color:white; font-size:24px;"><i class="ph-x"></i></button>
        <div style="font-weight:600;">AI Camera Scanner</div>
        <div style="width:24px;"></div>
    </div>
    <div class="scanner-body" id="scanner-viewport">
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="scanner-frame">
            <span style="color:white; font-size:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px;">Arahkan kamera ke halaman mushaf / kitab</span>
        </div>
        <div id="detection-boxes"></div>
    </div>
    <div class="scanner-footer">
        <p id="scanner-status" style="font-size:13px; margin-bottom:12px; color:rgba(255,255,255,0.9);">Siap memindai bacaan Ghorib secara langsung...</p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="simulateScanDetection()" style="padding:10px 18px; font-size:13px; width:auto;">Deteksi Teks Live</button>
            <button class="btn btn-outline" onclick="openManualSearchFallback()" style="color:white; border-color:rgba(255,255,255,0.5); padding:10px 18px; font-size:13px; width:auto;">Cari Manual</button>
        </div>
    </div>
</div>

<!-- Bottom Sheet Popup Card (Scanner Result) -->
<div class="popup-sheet" id="scanner-popup">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span class="status-badge sedang" id="popup-badge">Bacaan Ghorib</span>
        <button onclick="closePopupSheet()" style="font-size:20px; color:var(--text-muted);"><i class="ph-x"></i></button>
    </div>
    <h3 id="popup-title" style="margin-bottom:2px; font-size:20px;">Imalah</h3>
    <p id="popup-surat" style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Surat Hud: 41</p>
    <div class="text-arab" id="popup-arab" style="font-size:26px; margin:8px 0; text-align:center; background:var(--bg-main); padding:12px; border-radius:var(--rad-sm);">بِسْمِ ٱللَّهِ مَجْرٜىٰهَا</div>
    <div id="popup-audio-container"></div>
    <p id="popup-desc" style="font-size:13px; margin:10px 0; color:var(--text-main); line-height:1.4;">Mencondongkan fathah kepada kasrah...</p>
    <button class="btn btn-primary" id="popup-detail-btn" style="margin-top:8px;">📖 Pelajari Lebih Lanjut</button>
</div>

<script>
    // ==========================================
    // 1. DATA CENTER — 13 MATERIALS (DOCX SOURCE)
    // ==========================================
    const MATERIALS = [
        {
            id: 1, title: 'Imalah', surat: 'Surat Hud', ayat: '41', juz: '12',
            desc: 'Imalah secara bahasa berarti condong. Secara istilah berarti mencondongkan fathah kepada kasrah dan mencondongkan alif kepada ya. Dalam Al-Qur\'an riwayat Hafsh hanya terdapat pada satu tempat.',
            arabic: 'بِسْمِ ٱللَّهِ <span class="highlight">مَجْرٜىٰهَا</span> وَمُرْسَىٰهَآ',
            audio: 'bacaan 1.m4a',
            keywords: ['majraha', 'imalah', 'hud']
        },
        {
            id: 2, title: 'Isymam', surat: 'Surat Yusuf', ayat: '11', juz: '12',
            desc: 'Isymam adalah mencampurkan dhommah pada sukun dengan memoncongkan dua bibir saat membaca lafaz ta\'amanna.',
            arabic: 'قَالُوا۟ يَـٰٓأَبَانَا مَا لَكَ <span class="highlight">لَا تَأْمَ۫نَّا</span> عَلَىٰ يُوسُفَ',
            audio: 'bacaan 2.m4a',
            keywords: ['taamanna', 'isymam', 'yusuf']
        },
        {
            id: 3, title: 'Saktah', surat: 'Al-Kahfi', ayat: '1-2', juz: '15',
            desc: 'Saktah adalah berhenti sejenak tanpa bernapas selama kurang lebih 2 harakat dengan tujuan memperjelas makna.',
            arabic: 'عِوَجَاۜ ۝ قَيِّمًا',
            audio: 'bacaan 3.m4a',
            keywords: ['saktah', 'kahfi', 'yasin']
        },
        {
            id: 4, title: 'Tashil', surat: 'Fussilat', ayat: '44', juz: '24',
            desc: 'Tashil secara bahasa berarti memberi kemudahan. Secara istilah membaca hamzah kedua di antara hamzah dan alif.',
            arabic: '<span class="highlight">ءَا۬عْجَمِىٌّ</span> وَعَرَبِىٌّ',
            audio: 'bacaan 4.m4a',
            keywords: ['a\'jamiyyun', 'tashil', 'fussilat']
        },
        {
            id: 5, title: 'Naql', surat: 'Al-Hujurat', ayat: '11', juz: '26',
            desc: 'Naql adalah memindahkan harakat hamzah ke huruf mati sebelumnya, yaitu membaca al-ismu menjadi l-ismu.',
            arabic: '<span class="highlight">بِئْسَ ٱلِٱسْمُ</span> ٱلْفُسُوقُ',
            audio: 'bacaan 5.m4a',
            keywords: ['biitsismu', 'naql', 'hujurat']
        },
        {
            id: 6, title: 'Mad Badal', surat: 'Umum', ayat: '-', juz: '-',
            desc: 'Mad Badal terjadi apabila hamzah bertemu dengan huruf mad di dalam satu kata karena penggantian hamzah sukun.',
            arabic: '<span class="highlight">ءَامَنُوا۟</span>',
            audio: 'bacaan 6.m4a',
            keywords: ['aamanu', 'mad badal']
        },
        {

    function handleProfilePhotoInput(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if(!file) return;

        if(!PROFILE_PHOTO_TYPES.includes(file.type)) {
            alert('Format foto belum didukung. Gunakan JPG, PNG, atau WEBP.');
            return;
        }
        if(file.size > PROFILE_PHOTO_MAX_BYTES) {
            alert('Ukuran foto terlalu besar. Gunakan foto maksimal 5 MB.');
            return;
        }

        const modal = document.getElementById('profile-crop-modal');
        const img = document.getElementById('profile-crop-image');
        const zoom = document.getElementById('profile-crop-zoom');
        const preview = document.getElementById('profile-crop-preview');
        if(!modal || !img) return;

        if(profileCropState.objectUrl) URL.revokeObjectURL(profileCropState.objectUrl);
        const objectUrl = URL.createObjectURL(file);
        profileCropState = {
            image: img,
            objectUrl,
            scale: 1,
            minScale: 1,
            x: 0,
            y: 0,
            dragging: false,
            startX: 0,
            startY: 0,
            startImageX: 0,
            startImageY: 0
        };

        img.onload = () => {
            const stage = document.getElementById('profile-crop-stage');
            const baseScale = Math.max(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
            profileCropState.minScale = baseScale;
            profileCropState.scale = baseScale;
            profileCropState.x = 0;
            profileCropState.y = 0;
            zoom.min = baseScale.toFixed(4);
            zoom.max = (baseScale * 3).toFixed(4);
            zoom.step = Math.max(baseScale / 100, 0.001).toFixed(4);
            zoom.value = baseScale;
            preview.style.display = 'none';
            updateCropTransform();
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
        };
        img.src = objectUrl;
    }

    function updateCropTransform() {
        const img = profileCropState.image;
        if(!img) return;
        img.style.width = `${img.naturalWidth * profileCropState.scale}px`;
        img.style.height = `${img.naturalHeight * profileCropState.scale}px`;
        img.style.transform = `translate(calc(-50% + ${profileCropState.x}px), calc(-50% + ${profileCropState.y}px))`;
        renderProfileCropPreview();
    }

    function clampCropPosition() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        if(!stage || !img) return;
        const renderedW = img.naturalWidth * profileCropState.scale;
        const renderedH = img.naturalHeight * profileCropState.scale;
        const maxX = Math.max(0, (renderedW - stage.clientWidth) / 2);
        const maxY = Math.max(0, (renderedH - stage.clientHeight) / 2);
        profileCropState.x = Math.max(-maxX, Math.min(maxX, profileCropState.x));
        profileCropState.y = Math.max(-maxY, Math.min(maxY, profileCropState.y));
    }

    function renderProfileCropPreview() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        const preview = document.getElementById('profile-crop-preview');
        if(!stage || !img || !img.naturalWidth || !preview) return;

        clampCropPosition();

        const canvas = document.createElement('canvas');
        const outputSize = 256;
        canvas.width = outputSize;
        canvas.height = outputSize;
        const ctx = canvas.getContext('2d');

        const scale = profileCropState.scale;
        const renderedW = img.naturalWidth * scale;
        const renderedH = img.naturalHeight * scale;
        const stageSize = stage.clientWidth;
        const imageLeft = (stageSize - renderedW) / 2 + profileCropState.x;
        const imageTop = (stageSize - renderedH) / 2 + profileCropState.y;
        const sourceX = Math.max(0, (0 - imageLeft) / scale);
        const sourceY = Math.max(0, (0 - imageTop) / scale);
        const sourceSize = stageSize / scale;

        ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, outputSize, outputSize);
        preview.src = canvas.toDataURL('image/jpeg', 0.9);
        preview.style.display = 'block';
    }

    function saveProfileCrop() {
        const stage = document.getElementById('profile-crop-stage');
        const img = profileCropState.image;
        if(!stage || !img || !img.naturalWidth) return;

        clampCropPosition();

        const canvas = document.createElement('canvas');
        const outputSize = 512;
        canvas.width = outputSize;
        canvas.height = outputSize;
        const ctx = canvas.getContext('2d');

        const scale = profileCropState.scale;
        const renderedW = img.naturalWidth * scale;
        const renderedH = img.naturalHeight * scale;
        const stageSize = stage.clientWidth;
        const imageLeft = (stageSize - renderedW) / 2 + profileCropState.x;
        const imageTop = (stageSize - renderedH) / 2 + profileCropState.y;
        const sourceX = Math.max(0, (0 - imageLeft) / scale);
        const sourceY = Math.max(0, (0 - imageTop) / scale);
        const sourceSize = stageSize / scale;

        ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, outputSize, outputSize);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.88);

        if(!AppState.user) AppState.user = { name: 'Aulia', gender: 'L', isLoggedIn: true };
        AppState.user.profilePhoto = dataUrl;
        Storage.set('user', AppState.user);

        closeProfileCrop();
        navigate('profile');
    }

    function closeProfileCrop() {
        const modal = document.getElementById('profile-crop-modal');
        if(modal) {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
        }
        if(profileCropState.objectUrl) {
            URL.revokeObjectURL(profileCropState.objectUrl);
        }
        profileCropState = {
            image: null, objectUrl: null, scale: 1, minScale: 1,
            x: 0, y: 0, dragging: false, startX: 0, startY: 0,
            startImageX: 0, startImageY: 0
        };

    function setupProfileCropInteractions() {
        const stage = document.getElementById('profile-crop-stage');
        const img = document.getElementById('profile-crop-image');
        const zoom = document.getElementById('profile-crop-zoom');
        if(!stage || !img || !zoom || stage.dataset.bound === 'true') return;
        stage.dataset.bound = 'true';

        zoom.addEventListener('input', () => {
            const oldScale = profileCropState.scale;
            const newScale = Number(zoom.value);
            if(!oldScale) return;
            const ratio = newScale / oldScale;
            profileCropState.x *= ratio;
            profileCropState.y *= ratio;
            profileCropState.scale = newScale;
            clampCropPosition();
            updateCropTransform();
        });

        const startDrag = (e) => {
            if(!profileCropState.image) return;
            profileCropState.dragging = true;
            profileCropState.startX = e.clientX;
            profileCropState.startY = e.clientY;
            profileCropState.startImageX = profileCropState.x;
            profileCropState.startImageY = profileCropState.y;
            img.classList.add('dragging');
            if(e.pointerId !== undefined) stage.setPointerCapture(e.pointerId);
        };
        const moveDrag = (e) => {
            if(!profileCropState.dragging) return;
            profileCropState.x = profileCropState.startImageX + (e.clientX - profileCropState.startX);
            profileCropState.y = profileCropState.startImageY + (e.clientY - profileCropState.startY);
            clampCropPosition();
            updateCropTransform();
        };
        const endDrag = () => {
            profileCropState.dragging = false;
            img.classList.remove('dragging');
        };

        stage.addEventListener('pointerdown', startDrag);
        stage.addEventListener('pointermove', moveDrag);
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);
        stage.addEventListener('pointerleave', endDrag);
    }

    function stopAudio() {
        if(AppState.currentAudioNode) {
            AppState.currentAudioNode.pause();
            if(AppState.currentAudioPlayer) {
                const icon = AppState.currentAudioPlayer.querySelector('.play-btn i');
                if(icon) icon.className = 'ph-fill ph-play';
            }
            AppState.currentAudioNode = null;
            AppState.currentAudioPlayer = null;
        }
    }

    function toggleAudio(src, playerContainer) {
        const icon = playerContainer.querySelector('.play-btn i');
        const progressBar = playerContainer.querySelector('.custom-slider');
        const timeDisplay = playerContainer.querySelector('.current-time');
        
        if(AppState.currentAudioNode && AppState.currentAudioNode.src.endsWith(src) && !AppState.currentAudioNode.paused) {
            AppState.currentAudioNode.pause();
            icon.className = 'ph-fill ph-play';
            return;
        }

        stopAudio();

        AppState.currentAudioNode = new Audio(`assets/${src}`); 
        AppState.currentAudioNode.onerror = () => {
            console.warn(`File audio '${src}' tidak ditemukan lokal.`);
            icon.className = 'ph-fill ph-play';
        };
        
        AppState.currentAudioPlayer = playerContainer;
        icon.className = 'ph-fill ph-pause';
        
        AppState.currentAudioNode.play().catch(e => {
            console.log("Autoplay / audio play handled:", e);
            icon.className = 'ph-fill ph-play';
        });

        addXP(2); // Audio reward

        AppState.currentAudioNode.ontimeupdate = () => {
            const ratio = AppState.currentAudioNode.currentTime / AppState.currentAudioNode.duration;
            if(progressBar) progressBar.value = ratio ? ratio * 100 : 0;
            if(timeDisplay) timeDisplay.innerText = formatTime(AppState.currentAudioNode.currentTime);
        };
        
        AppState.currentAudioNode.onended = () => {
            icon.className = 'ph-fill ph-play';
            if(progressBar) progressBar.value = 0;
            if(timeDisplay) timeDisplay.innerText = "0:00";
        };
    }

    function formatTime(seconds) {
        if(isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' + s : s}`;
    }

    function renderAudioPlayer(src, title) {
        return `
        <div class="audio-player" data-src="${src}">
            <div class="audio-controls">
                <button class="play-btn" onclick="toggleAudio('${src}', this.closest('.audio-player'))"><i class="ph-fill ph-play"></i></button>
                <div class="track-info">
                    <div style="font-weight:600; font-size:14px; margin-bottom:4px;">${title}</div>
                    <div class="time-display">
                        <span class="current-time">0:00</span>
                        <span class="total-time">--:--</span>
                    </div>
                    <input type="range" class="custom-slider" value="0" min="0" max="100" readonly>
                </div>
            </div>
        </div>
        `;
    }

        statusEl.innerText = "Menganalisis halaman mushaf...";
        boxContainer.innerHTML = '';

        setTimeout(() => {

            boxContainer.innerHTML = `

    function buildMaterialCards(filterMode = 'all', searchQuery = '') {
        let html = '';
        const p = AppState.progress;
        let filtered = MATERIALS.filter(m => {
            const matchesSearch = m.title.toLowerCase().includes(searchQuery.toLowerCase()) || m.surat.toLowerCase().includes(searchQuery.toLowerCase());
            if(!matchesSearch) return false;
            const isDone = p.completed.includes(m.id);
            const isProg = p.inProgress.includes(m.id);
            if(filterMode === 'done') return isDone;
            if(filterMode === 'prog') return isProg && !isDone;
            if(filterMode === 'not') return !isDone && !isProg;
            return true;
        });

        if(filtered.length === 0) return `<p style="text-align:center; padding:32px; color:var(--text-muted);">Tidak ada materi yang sesuai.</p>`;

        filtered.forEach(m => {
            let status = 'Belum dipelajari', badgeClass = '';
            if(p.completed.includes(m.id)) { status = 'Selesai ✓'; badgeClass = 'selesai'; }
            else if(p.inProgress.includes(m.id)) { status = 'Sedang dipelajari'; badgeClass = 'sedang'; }

            html += `
                <div class="card material-card" onclick="navigate('material-detail', ${m.id})" style="cursor:pointer;">
                    <div class="material-num">${m.id < 10 ? '0'+m.id : m.id}</div>
                    <div class="material-info">
                        <h3 style="margin:0;">${m.title}</h3>
                        <div style="font-size:12px; color:var(--text-muted);">${m.surat}: ${m.ayat}</div>
                        <div class="material-meta">
                            <span class="status-badge ${badgeClass}">${status}</span>
                            <span style="color:var(--primary); font-weight:600;">Pelajari <i class="ph-caret-right"></i></span>
                        </div>
                    </div>
                </div>
            `;
        });
        return html;
    }

    function renderQuizRun() {
        const q = QUIZ_QUESTIONS[quizState.currentIdx];
        const pct = (quizState.currentIdx / QUIZ_QUESTIONS.length) * 100;
        let html = `
            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:6px;">

            <div id="quiz-options">
        `;
        q.options.forEach((opt, idx) => {
            html += `<div class="quiz-option" onclick="selectQuizAnswer(${idx})">${String.fromCharCode(65+idx)}. ${opt}</div>`;
        });
        html += `</div><button id="btn-next-quiz" class="btn btn-primary" style="margin-top:20px; opacity:0.5; pointer-events:none;" onclick="nextQuizQuestion()">Lanjutkan</button>`;
        return html;

    function selectQuizAnswer(idx) {
        document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('.quiz-option')[idx].classList.add('selected');
        quizState.selected = idx;
        const btn = document.getElementById('btn-next-quiz');
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
    }

    function nextQuizQuestion() {
        if(quizState.selected === QUIZ_QUESTIONS[quizState.currentIdx].ans) {
            quizState.score++;
            addXP(10);
        }
        quizState.currentIdx++;
        if(quizState.currentIdx >= QUIZ_QUESTIONS.length) {
            navigate('quiz-result', { score: quizState.score, pct: Math.round((quizState.score / QUIZ_QUESTIONS.length) * 100) });

            navigate('quiz-run');

    }

                    ${photo
                        ? `<img class="profile-photo" src="${photo}" alt="Foto profil" style="width:96px;height:96px;">`
                        : `<div style="width:96px;height:96px;border-radius:50%;background:var(--primary);color:white;font-size:36px;display:flex;align-items:center;justify-content:center;">${u.name.charAt(0).toUpperCase()}</div>`
                    }
                </div>
                <h2>${u.name}</h2>
                <p style="font-size:13px;">Level ${lvl.level} • ${lvl.name}</p>
                <input type="file" id="profile-photo-input" accept="image/jpeg,image/png,image/webp" hidden onchange="handleProfilePhotoInput(this)">
                <button class="btn btn-outline" type="button" style="width:auto; padding:8px 16px; margin-top:4px;" onclick="document.getElementById('profile-photo-input').click()">
                    <i class="ph-camera"></i> Ubah Foto
                </button>
                <p style="font-size:11px; margin:8px 0 0;">JPG, PNG, atau WEBP • Maks. 5 MB • Crop 1:1</p>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;">
                    <span>Nama</span> <b>${u.name}</b>
                </div>
                <div style="display:flex; justify-content:space-between; padding:8px 0; font-size:14px;">
                    <span>Total XP</span> <b style="color:var(--primary);">${AppState.progress.xp} XP</b>
                </div>
            </div>
            <button class="btn btn-outline" style="color:var(--error); border-color:var(--error); margin-top:20px;" onclick="doLogout()"><i class="ph-sign-out"></i> Keluar</button>
        `;
    }

    function doLogout() {
        AppState.user = null;
        Storage.remove('user');
        navigate('splash');
    }

    function renderSettings() {
        return `
            <h2>Pengaturan</h2>
            <div class="card" style="margin-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0;">
                    <div><div style="font-weight:600; font-size:14px;">Reset Progress & XP</div><div style="font-size:12px; color:var(--text-muted);">Hapus semua data belajar lokal</div></div>
                    <button class="btn btn-outline" style="width:auto; padding:6px 12px; color:var(--error); border-color:var(--error); font-size:12px;" onclick="confirmReset()">Reset</button>
                </div>
            </div>
        `;
    }

    function confirmReset() {
        if(confirm("Apakah Anda yakin ingin mereset seluruh progress pembelajaran?")) {
            AppState.progress = { completed: [], inProgress: [], quizScores: [], lastMaterial: null, xp: 0, streak: 1, achievements: [] };
            saveProgress();
            alert("Progress berhasil direset.");
            navigate('home');
        }
    }

    function renderAbout() {
        return `
            <h2>Tentang GHORIB SMART</h2>
            <p>GHORIB SMART adalah platform media pembelajaran interaktif yang dirancang untuk membantu memahami bacaan-bacaan Ghorib Al-Qur'an secara terstruktur dan teruji.</p>
            <div class="card" style="margin-top:16px;">
                <h3 style="margin-bottom:8px;">Fitur Unggulan</h3>
                <ul style="padding-left:20px; color:var(--text-muted); font-size:14px; line-height:1.8;">
                    <li>13 Materi Ghorib terstruktur sesuai dokumen standar</li>
                    <li>13 Audio pelafalan resmi (.m4a)</li>
                    <li>AI Camera Scanner untuk memindai lafaz mushaf secara cepat</li>
                    <li>Gamifikasi XP, Level, dan Badge Pencapaian</li>
                </ul>
            </div>
        `;
    }

    function renderFAQ() {
        return `
            <h2>FAQ (Pertanyaan Umum)</h2>
            <div class="card" style="margin-top:16px;">
                <h3 style="font-size:15px; margin-bottom:4px;">Apa itu bacaan Ghorib?</h3>
                <p style="font-size:13px; color:var(--text-muted); margin:0;">Bacaan Ghorib adalah lafaz-lafaz khusus dalam Al-Qur'an yang cara membacanya keluar dari kaidah umum atau membutuhkan cara pelafalan khusus.</p>
            </div>
            <div class="card">
                <h3 style="font-size:15px; margin-bottom:4px;">Bagaimana cara kerja AI Scanner?</h3>
                <p style="font-size:13px; color:var(--text-muted); margin:0;">Arahkan kamera smartphone Anda ke halaman mushaf, lalu sistem akan mendeteksi lafaz Ghorib dan menampilkan popup penjelasan beserta audio pelafalannya.</p>
            </div>
        `;
    }

    // Helper Filter Tab
    window.setTab = function(el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        filterMaterials();
    };

    window.filterMaterials = function() {
        const activeTab = document.querySelector('.tab.active').getAttribute('data-filter');
        const searchQ = document.getElementById('search-mat').value;
        document.getElementById('material-list-container').innerHTML = buildMaterialCards(activeTab, searchQ);
    };

    document.addEventListener('click', (event) => {
        const menu = document.getElementById('profile-menu');
        const wrap = event.target.closest('.profile-menu-wrap');
        if(menu && !wrap) closeProfileMenu();
    });

    document.addEventListener('keydown', (event) => {
        if(event.key === 'Escape') {
            closeProfileMenu();
            closeProfileCrop();
        }
    });

    document.addEventListener('DOMContentLoaded', setupProfileCropInteractions);

    function attachViewListeners(viewId, container, params) {
        if(viewId === 'identity') {
            const btnSave = container.querySelector('#btn-save-identity');
            const inpName = container.querySelector('#inp-name');
            const radios = container.querySelectorAll('.radio-card');
            let selectedGender = null;
            radios.forEach(r => r.onclick = () => {
                radios.forEach(x => x.classList.remove('selected'));
                r.classList.add('selected');
                selectedGender = r.getAttribute('data-val');
            });
            btnSave.onclick = () => {
                if(!inpName.value.trim()) { alert("Mohon isi nama Anda."); return; }
                AppState.user = { name: inpName.value.trim(), gender: selectedGender || 'L', isLoggedIn: false };
                navigate('login');
            };
        }
        if(viewId === 'materials') {
            container.querySelector('#material-list-container').innerHTML = buildMaterialCards('all', '');
        }
    }

    // Initial Load
    navigate('splash');
</script>
</body>
</html>
